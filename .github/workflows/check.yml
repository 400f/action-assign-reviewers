name: check
on:
  pull_request:

permissions: {}

jobs:
  check: # dist/ is what the action runs, so it must match a fresh build of the sources
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format-check
      - run: yarn lint
      - run: yarn build
      - run: yarn package
      - run: test -z "$(git status --porcelain dist/)" || { git status --porcelain dist/; exit 1; }
